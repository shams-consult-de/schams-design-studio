    <!-- FAQPage Schema.org JSON-LD -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Wie berechnen sich die Honorare für Architektenleistungen nach der HOAI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Die Architektenhonorare richten sich nach den offiziellen Leistungsphasen (1 bis 9) der Honorarordnung für Architekten und Ingenieure (HOAI). Die Berechnung basiert auf den anrechenbaren Baukosten und der Einstufung des Gebäudes in eine Honorarzone (z.B. Honorarzone III oder IV bei anspruchsvollem Wohnungs- oder Gewerbebau). Shams Consult erstellt für Sie vor Projektbeginn eine transparente, nach Einzelschritten aufgeschlüsselte Honorarvereinbarung."
            }
          },
          {
            "@type": "Question",
            "name": "Wie lange dauert ein Baugenehmigungsverfahren in Hessen (HBO)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Im vereinfachten Genehmigungsverfahren nach § 65 HBO (üblich für Ein- und Mehrfamilienhäuser) liegt die Bearbeitungszeit bei den hessischen Bauaufsichtsämtern (z.B. Frankfurt, Offenbach, Wiesbaden, Darmstadt) meist zwischen 3 und 5 Monaten. Durch lückenlose, prüffähige Bauanträge mit vollständigen Fachnachweisen (Standsicherheit, Brandschutz, Entwässerung) verhindern wir Rückfragen und beschleunigen die Genehmigung."
            }
          },
          {
            "@type": "Question",
            "name": "Übernimmt Shams Consult die vollständige Betreuung von Entwurf bis Bauüberwachung?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja, wir begleiten Bauvorhaben ganzheitlich durch alle 9 HOAI-Leistungsphasen: von der ersten Grundlagenermittlung und Vorplanung (LPH 1–2) über die Entwurfs- und Genehmigungsplanung (LPH 3–4) bis hin zur detaillierten Werk- und Ausführungsplanung (LPH 5), Ausschreibung (LPH 6–7) und der täglichen Bauleitung vor Ort bis zur Endabnahme (LPH 8–9)."
            }
          },
          {
            "@type": "Question",
            "name": "Welche Fördermittel stehen für KfW-Effizienzhäuser und QNG-Nachhaltigkeitszertifikate bereit?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Über die Bundesförderung für effiziente Gebäude (BEG) und das KfW-Programm 'Klimafreundlicher Neubau' (KFN / Programme 297/298) können Bauherren zinsverbilligte Förderkredite von bis zu 150.000 € pro Wohneinheit sowie attraktive Tilgungszuschüsse beantragen. Bei Erreichung des staatlichen QNG-Siegels (Qualitätssiegel Nachhaltiges Gebäude) steigen die Förderquoten signifikant. Wir integrieren diese Standards von Beginn an in die Gebäudeplanung."
            }
          },
          {
            "@type": "Question",
            "name": "Was geschieht in einem ersten Beratungsgespräch mit dem Architekten?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Im Erstgespräch analysieren wir Ihre Projektziele, die baurechtlichen Rahmenbedingungen Ihres Grundstücks (Bebauungsplan oder § 34 BauGB) sowie den baulichen Bestand. Sie erhalten eine erste realistische Einschätzung zu Machbarkeit, Genehmigungschancen, Kostenrahmen und Zeitplan für die Realisierung."
            }
          },
          {
            "@type": "Question",
            "name": "Was ist der Unterschied zwischen einem Bebauungsplan (B-Plan) und § 34 BauGB (Innenbereich)?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Liegt ein qualifizierter Bebauungsplan (B-Plan) vor, regelt dieser detailliert Geschossflächenzahl (GFZ), Grundflächenzahl (GRZ), Dachformen und Bauhöhen. Gibt es keinen B-Plan, greift § 34 BauGB: Das Bauvorhaben muss sich nach Art und Maß der baulichen Nutzung, der Bauweise und der Grundstücksfläche harmonisch in die Eigenart der näheren Umgebung einfügen. Wir klären das Baurecht vorab verlässlich mit der zuständigen Bauaufsicht."
            }
          }
        ]
      }
