name: Build & Deploy Static Site to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Static Site to IONOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Production Site
        run: npm run build

      - name: Deploy Static Files to IONOS via SFTP
        env:
          FTP_SERVER: ${{ secrets.IONOS_FTP_SERVER }}
          FTP_USER: ${{ secrets.IONOS_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.IONOS_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.IONOS_FTP_DIR || '.' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$FTP_USER","$FTP_PASS" -p 22 -e "
            set sftp:auto-confirm yes;
            mirror -R --delete --verbose dist/ ${FTP_DIR};
            quit
          " sftp://"$FTP_SERVER"
