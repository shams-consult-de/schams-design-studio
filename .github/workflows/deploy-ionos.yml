name: Build & Deploy Static Site to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy Static Site to IONOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Static Production Site
        run: npm run build

      - name: Deploy Static Files to IONOS via SFTP
        env:
          SSHPASS: ${{ secrets.IONOS_FTP_PASSWORD }}
          FTP_SERVER: ${{ secrets.IONOS_FTP_SERVER }}
          FTP_USER: ${{ secrets.IONOS_FTP_USERNAME }}
          FTP_DIR: ${{ secrets.IONOS_FTP_DIR || '.' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          cd dist
          sshpass -e sftp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P 22 "$FTP_USER@$FTP_SERVER" << EOF
          cd $FTP_DIR
          -rm -rf dist
          put -r .
          put .htaccess .
          bye
          EOF
